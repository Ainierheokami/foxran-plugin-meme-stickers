manifest_version: 1

extension:
  id: "meme_stickers"
  name: "Meme Stickers"
  version: "1.1.1"
  type: "tool"
  description: "A full-stack plugin providing a meme sticker library, AI injection logic, and frontend management GUI."
  author: "Ainierheokami"
  repository: "https://github.com/Ainierheokami/foxran-plugin-meme-stickers"
  tags:
    - "media"
    - "fun"
    - "webui"

compatibility:
  foxran: ">=2.0.0,<4.0.0"
  python: ">=3.10"

tool:
  entry: "__init__.py"
  frontend_bundle: "index.umd.js"
